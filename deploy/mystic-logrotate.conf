# Mystic local log rotation (24/7 laptop operation).
# start_mystic.sh redirects stdout/stderr into logs/*.log, so the descriptor
# stays open for the life of the process. copytruncate is required.
# Invoke hourly via scripts/disk_hygiene.sh (user cron).
/home/mystic/mystic/logs/*.log
/home/mystic/.cursor/debug.log
/tmp/mystic_*.log {
    hourly
    rotate 5
    size 20M
    missingok
    notifempty
    compress
    copytruncate
}
