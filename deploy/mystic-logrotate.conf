# Mystic local log rotation (24/7 laptop operation).
# Runs against the nohup logs written by start_mystic.sh.
# Invoke hourly via user cron with a local state file, e.g.:
#   0 * * * * /usr/sbin/logrotate -s /home/mystic/mystic/.logrotate.state /home/mystic/mystic/deploy/mystic-logrotate.conf
# copytruncate keeps the same file handles valid for the running nohup processes.
/tmp/mystic_*.log {
    hourly
    rotate 6
    size 50M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
