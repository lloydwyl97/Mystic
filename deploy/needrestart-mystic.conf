# Mystic: needrestart must not bounce services Mystic depends on after a library
# upgrade. Pending restarts are completed by the safe maintenance reboot.
#
# Install (as root on mystic-prod):
#   cp /home/mystic/mystic/deploy/needrestart-mystic.conf /etc/needrestart/conf.d/mystic.conf
$nrconf{override_rc}{qr(^redis-server)} = 0;
$nrconf{override_rc}{qr(^cron)} = 0;
$nrconf{override_rc}{qr(^caddy)} = 0;
