apiVersion: apps/v1
kind: Deployment
metadata:
  name: mystic-trading-app
  namespace: mystic-trading
  labels:
    app: mystic-trading
    component: app
spec:
  replicas: 4  # Increased from 3 to 4
  selector:
    matchLabels:
      app: mystic-trading
      component: app
  template:
    metadata:
      labels:
        app: mystic-trading
        component: app
    spec:
      containers:
      - name: mystic-trading
        image: python:3.10-slim
        command: ["python", "run_backend.py"]
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: DATABASE_URL
          value: "sqlite:///data/mystic_trading.db"
        - name: AI_DATABASE_URL
          value: "sqlite:///data/ai_live.sqlite"
        - name: CACHE_DATABASE_URL
          value: "sqlite:///data/cache.db"
        - name: LOG_LEVEL
          value: "WARNING"  # Changed from INFO to WARNING to reduce logging overhead
        - name: WORKERS
          value: "2"  # Increased from 1 to 2
        - name: OPTIMIZE_STARTUP
          value: "true"  # Enable optimized startup
        - name: CACHE_TTL_SECONDS
          value: "300"  # 5 minutes
        - name: SQLITE_JOURNAL_MODE
          value: "WAL"  # Use WAL mode for SQLite
        - name: SQLITE_SYNCHRONOUS
          value: "NORMAL"  # Better SQLite performance
        - name: SQLITE_CACHE_SIZE
          value: "64000"  # 64MB cache
        volumeMounts:
        - name: data-storage
          mountPath: /app/data
        - name: logs-storage
          mountPath: /app/logs
        - name: models-storage
          mountPath: /app/models
        - name: config-volume
          mountPath: /app/config
        - name: redis-config
          mountPath: /app/redis.conf
          subPath: redis.conf
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:  # Added startup probe
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 3
          timeoutSeconds: 3
          failureThreshold: 10
        resources:
          requests:
            memory: "1Gi"  # Increased from 512Mi
            cpu: "500m"    # Increased from 250m
          limits:
            memory: "2Gi"  # Increased from 1Gi
            cpu: "1000m"   # Increased from 500m
      volumes:
      - name: data-storage
        persistentVolumeClaim:
          claimName: mystic-data-pvc
      - name: logs-storage
        persistentVolumeClaim:
          claimName: mystic-logs-pvc
      - name: models-storage
        persistentVolumeClaim:
          claimName: mystic-models-pvc
      - name: config-volume
        configMap:
          name: app-config
      - name: redis-config
        configMap:
          name: redis-config
