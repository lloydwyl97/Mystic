apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mystic-trading-ingress
  namespace: mystic-trading
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - your-trading-domain.com
    secretName: mystic-trading-tls
  rules:
  - host: your-trading-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mystic-trading-service
            port:
              number: 80
  - host: api.your-trading-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mystic-trading-service
            port:
              number: 80
