apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mystic-trading-network-policy
  namespace: mystic-trading
  labels:
    app: mystic-trading
spec:
  podSelector:
    matchLabels:
      app: mystic-trading
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  # Allow traffic between app pods
  - from:
    - podSelector:
        matchLabels:
          app: mystic-trading
    ports:
    - protocol: TCP
  # Allow traffic from monitoring pods
  - from:
    - podSelector:
        matchLabels:
          app: mystic-trading
          component: monitoring
    ports:
    - protocol: TCP
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Allow HTTPS outbound (for external APIs)
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Allow Redis communication
  - to:
    - podSelector:
        matchLabels:
          app: mystic-trading
          component: redis
    ports:
    - protocol: TCP
      port: 6379
  # Allow PostgreSQL communication
  - to:
    - podSelector:
        matchLabels:
          app: mystic-trading
          component: postgres
    ports:
    - protocol: TCP
      port: 5432
  # Allow communication within namespace
  - to:
    - podSelector:
        matchLabels:
          app: mystic-trading
