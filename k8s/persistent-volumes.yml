apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mystic-data-pvc
  namespace: mystic-trading
  labels:
    app: mystic-trading
    component: data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard
---
