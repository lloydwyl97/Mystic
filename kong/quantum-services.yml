_format_version: "2.1"

services:
  - name: qiskit-service
    url: http://mystic-qiskit:8087
    routes:
      - name: qiskit-root
        paths:
          - /quantum/qiskit
        strip_path: true
        methods: [GET, POST]
    plugins:
      - name: prometheus
      - name: rate-limiting
        config:
          minute: 100
          hour: 1000
          limit_by: ip
          policy: local

  - name: cirq-service
    url: http://mystic-cirq:8088
    routes:
      - name: cirq-root
        paths:
          - /quantum/cirq
        strip_path: true
        methods: [GET, POST]
    plugins:
      - name: prometheus
      - name: rate-limiting
        config:
          minute: 100
          hour: 1000
          limit_by: ip
          policy: local

  - name: pennylane-service
    url: http://mystic-pennylane:8089
    routes:
      - name: pennylane-root
        paths:
          - /quantum/pennylane
        strip_path: true
        methods: [GET, POST]
    plugins:
      - name: prometheus
      - name: rate-limiting
        config:
          minute: 100
          hour: 1000
          limit_by: ip
          policy: local
