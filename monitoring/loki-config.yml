# Loki Configuration - Live Log Collection
# Collects live logs from Mystic Trading backend (port 8000) via Promtail
# All log data is live - no fallback or hardcoded data

auth_enabled: false

server:
  # Loki HTTP API port (Promtail sends logs here)
  http_listen_port: 3100
  # gRPC port for distributed deployments
  grpc_listen_port: 9096

common:
  # Bind to localhost - Promtail connects via service name 'loki' in Docker/K8s
  instance_addr: 127.0.0.1
  path_prefix: /tmp/loki
  storage:
    filesystem:
      # Live log storage directories (all live data)
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  # Cache configuration for live log queries
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  # Schema for live log storage and indexing
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

ruler:
  # AlertManager endpoint for live alerts (connects to AlertManager service)
  alertmanager_url: http://localhost:9093

# Analytics disabled - all data stays local, no external reporting
# Connection Flow:
# 1. Backend (port 8000) writes live logs to /app/logs/*.log
# 2. Promtail scrapes live log files and sends to Loki (port 3100)
# 3. Loki stores and indexes live log data
# 4. Grafana queries Loki for live log visualization
# All connections use live endpoints - no fallback or hardcoded data
analytics:
  reporting_enabled: false
