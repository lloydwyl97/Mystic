# Prometheus Configuration - Live Metrics Collection
# Collects live metrics from all services - all data is live, no fallback/hardcoded data

global:
  # Global scrape interval for live metrics collection
  scrape_interval: 15s
  # Rule evaluation interval for live alerting
  evaluation_interval: 15s

rule_files:
  # Alert rules can be added here for live alerting
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus self-monitoring (live metrics from Prometheus itself)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Mystic Trading Application - Live metrics from backend (port 8000)
  - job_name: 'mystic-trading'
    static_configs:
      # Backend runs on port 8000 and exposes live Prometheus metrics
      - targets: ['mystic-trading:8000']
    scrape_interval: 10s
    # Live metrics endpoint: /api/metrics (Prometheus format)
    metrics_path: '/api/metrics'

  # Redis - Live metrics from Redis exporter
  - job_name: 'redis'
    static_configs:
      # Redis metrics exporter (connects to live Redis instance)
      - targets: ['redis:6379']
    scrape_interval: 30s

  # Node Exporter - Live system metrics (CPU, memory, disk, network)
  - job_name: 'node-exporter'
    static_configs:
      # Live system metrics from node exporter
      - targets: ['node-exporter:9100']

  # Nginx - Live Nginx metrics via exporter
  - job_name: 'nginx'
    static_configs:
      # Live Nginx access/error metrics (connects to live Nginx)
      - targets: ['nginx:9113']

  # PostgreSQL - Live database metrics (if PostgreSQL is used)
  - job_name: 'postgres'
    static_configs:
      # Live PostgreSQL metrics from exporter (connects to live database)
      - targets: ['postgres:9187']
    scrape_interval: 30s
