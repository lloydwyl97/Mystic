# Nginx Configuration - Generated from Live Configuration
# This file should be generated using: python scripts/generate_nginx_config.py
# Or use the template with envsubst: envsubst < nginx/conf/default.conf.template > nginx/conf/default.conf
# All configuration values come from live config - no hardcoded values, no fallback data.
# DO NOT EDIT THIS FILE MANUALLY - it will be overwritten on config generation.

# This file is a placeholder. Run the generator script to create the actual configuration.
# For now, this file uses environment variables that must be set at runtime.
server {
    listen ${NGINX_LISTEN_PORT};
    server_name ${NGINX_SERVER_NAME};

    # API routes - proxy to backend
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Health check - proxy to backend
    location /health {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dashboard - all routes including WebSocket and static assets
    location / {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout ${NGINX_PROXY_READ_TIMEOUT};
        proxy_send_timeout ${NGINX_PROXY_SEND_TIMEOUT};
        proxy_connect_timeout ${NGINX_PROXY_CONNECT_TIMEOUT};
        proxy_buffering off;
    }
} 